name: Build macOS

on:
  workflow_dispatch: # Bấm nút chạy thủ công trên GitHub

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build source
        run: pnpm build

      - name: Package macOS app (unsigned)
        run: cd freelens && pnpm build:app:darwin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # skip code signing

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: freelens-macos
          path: freelens/dist/*.dmg

      - name: Upload .app (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: freelens-macos-app-arm64
          path: freelens/dist/mac-arm64/
